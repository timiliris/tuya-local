name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/tuya-ipc-terminal/go.mod
          cache-dependency-path: vendor/tuya-ipc-terminal/go.sum
      - name: Python dependencies
        run: pip install -r requirements.txt
      - name: Python checks
        run: |
          python -m py_compile src/*.py
          python -m unittest discover -s tests -p 'test_console*.py'
          python tests/test_i18n.py
          python tests/test_paths.py
          python tests/test_discover.py
          python tests/test_native_wakeup.py
          python tests/test_procutil.py
          python -m unittest discover -s tests -p 'test_release*.py'
      - name: Browser player and display tests
        run: node --test tests/*.cjs
      - name: Camera engine tests
        working-directory: vendor/tuya-ipc-terminal
        run: go test -race ./pkg/rtsp ./pkg/webrtc ./pkg/tuya
      - name: Standalone Docker image
        run: docker build -t tuya-local:ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan complete Git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --redact=100 --no-banner'
