<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Tuya Local</title><link rel="icon" href="/brand.svg" type="image/svg+xml"><link rel="stylesheet" href="/login.css"><script src="/i18n.js" defer></script><script src="/login.js" defer></script></head>
<body><main><header><img src="/brand.svg" width="52" height="52" alt=""><span>Tuya Local</span><select id="language" aria-label="Language"><option value="en">English</option><option value="fr">Français</option><option value="nl">Nederlands</option><option value="de">Deutsch</option><option value="es">Español</option></select></header><h1 data-i18n="Accès à votre serveur">Server access</h1><p data-i18n="Saisissez le mot de passe de ce serveur pour accéder aux caméras.">Enter this server’s password to access your cameras.</p><form id="login"><label for="username" data-i18n="Identifiant">Identifiant</label><input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="40" value="admin" autocapitalize="none" spellcheck="false"><label for="password" data-i18n="Mot de passe du serveur">Server password</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus><button data-i18n="Se connecter">Sign in</button><p id="login-error" role="alert"></p></form><footer data-i18n="Votre session reste sur cet appareil. La vidéo et l’analyse restent locales.">Your session stays on this device. Video and analysis stay local.</footer></main></body></html>
